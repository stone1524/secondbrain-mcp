[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "secondbrain-mcp"
version = "0.1.0"
description = "Local-first Markdown knowledge base with a safety-first MCP gateway: hash-locked writes, no-delete archiving, privacy zones, hybrid retrieval."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "stone1524" }]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
secondbrain-mcp = "secondbrain_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/secondbrain_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
