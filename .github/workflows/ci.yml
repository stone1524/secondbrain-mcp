name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dev dependencies
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
      # The retrieval gates used to run nowhere: CI stopped at pytest, the
      # health check never touched eval/, so a change that broke recall or
      # leaked the private zone into the index merged green. The demo vault is
      # synthetic and self-contained, so this needs no model cache — the gates
      # run lexical-only, and the semantic gate reports as not-applicable
      # rather than passing silently.
      - name: Build the demo index
        run: python -m secondbrain_mcp.adapters.cli --vault demo-vault index
      - name: Retrieval gates
        run: python -m secondbrain_mcp.eval.run --cases eval/cases-dev.json --report eval-report.json
      - name: Deployment contract
        run: python -m secondbrain_mcp.adapters.healthcheck
